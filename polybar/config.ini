; The bar for both i3 sessions, in place of i3bar. Started by launch.sh.
; Colours are One Dark, like config.ghostty. The icons are Font Awesome 4
; glyphs (apt: fonts-font-awesome); an editor without that font shows boxes.

[colors]
bg = #282c34
bg-alt = #3e4451
fg = #abb2bf
dim = #5c6370
blue = #61afef
green = #98c379
yellow = #e5c07b
red = #e06c75

[bar/main]
; launch.sh starts one bar per monitor and names the monitor here.
monitor = ${env:MONITOR:}
width = 100%
height = 30
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
padding-right = 2
module-margin = 2
font-0 = "Ubuntu:size=11;3"
font-1 = "FontAwesome:size=11;3"
modules-left = i3
modules-center = date
modules-right = volume battery tray

; Other monitors get the same bar without the tray, which can only exist once.
[bar/side]
inherit = bar/main
modules-right = volume battery

[module/i3]
type = internal/i3
; Each bar shows the workspaces of its own monitor, like i3bar.
pin-workspaces = true
format = <label-state> <label-mode>
label-focused = %name%
label-focused-padding = 3
label-focused-foreground = #ffffff
label-focused-background = ${colors.bg-alt}
label-focused-underline = ${colors.blue}
label-unfocused = %name%
label-unfocused-padding = 3
label-visible = %name%
label-visible-padding = 3
label-urgent = %name%
label-urgent-padding = 3
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
; The binding mode, such as "service".
label-mode-padding = 3
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.bg}

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%   %time%

; Click mutes, scrolling changes the volume.
[module/volume]
type = internal/pulseaudio
format-volume = <ramp-volume>  <label-volume>
; volume-down, volume-up
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-foreground = ${colors.blue}
label-volume = %percentage%%
; volume-off
label-muted =   muted
label-muted-foreground = ${colors.dim}

[module/battery]
type = internal/battery
; Named differently per machine; launch.sh looks them up.
battery = ${env:BAR_BATTERY:BAT0}
adapter = ${env:BAR_ADAPTER:AC}
format-discharging = <ramp-capacity>  <label-discharging>
format-charging = <ramp-capacity>  <label-charging>
format-full = <ramp-capacity>  <label-full>
; battery-empty, -quarter, -half, -three-quarters, -full
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.green}
label-discharging = %percentage%%
; bolt
label-charging = %percentage%% 
label-full = %percentage%%

; Wifi, Bluetooth and other applet icons.
[module/tray]
type = internal/tray
tray-spacing = 8px
