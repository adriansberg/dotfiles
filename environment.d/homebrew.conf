# Put Homebrew on PATH for the graphical session, so apps launched from the
# desktop (e.g. T3 Code looking for `claude`) find brew-installed tools.
# zshrc only covers terminals. Appended, not prepended: Ubuntu's tools win,
# brew fills the gaps.
PATH=${PATH}:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
